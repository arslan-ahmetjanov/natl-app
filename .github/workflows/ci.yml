name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Зависимости приложения
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Юнит-тесты
        working-directory: apps/desktop
        run: npm run test:natl

      - name: Линтер интерфейса
        working-directory: apps/desktop/frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint

  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, cli, adapter-playwright]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Сборка ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
